name: RDs_2018BParking_trkcalib
version: v4b_base_laptop
model:
  convention: cms
  eta_edges:
  - 0.0
  - 0.7
  - 1.2
  - 2.5
  terms:
  - A
  - e
  - M
  - a2
  - c2
  shared:
  - e
  - c2
  start:
    A: 0.001
    a2: 11.0
  fix: {}
  ties: {}
  limits:
    a2:
    - 0.0
    - 400.0
    c2:
    - 0.0
    - 400.0
  muon_terms:
  - a2
  - c2
  kaon_terms: []
  kaonB_terms: []
fit:
  seed: 12345
  z_mode: hash
  smooth_data: true
  start_from: results_v4/v4b_base/result.json
  mc_stat: true
  method: profile
channels:
  kkpi:
    enabled: true
    data:
    - /Users/manzoni/Documents/RDs/rds_momcalib/ntuples_26oct2026/rds/data_2018_rs_26oct2026.root
    mc:
    - /Users/manzoni/Documents/RDs/rds_momcalib/ntuples_26oct2026/rds/signal_26oct2026.root
    tree: tree
    max_data: null
    max_mc: null
    selection: (tv_prob > 0.05) & (fv_prob > 0.05) & (ds_vtx_cosine_xyz_pv > 0.995)
      & (dsMu_m < 5.37) & (sv_prob > 0.05)
    kk_window: 0.02
    dplus_veto: 0.05
    mass_range:
    - 1.92
    - 2.015
    bin_width: 0.001
    categories:
      pt_edges: null
      split_charge: true
      eta_edges: null
      kappa_edges:
      - -100.0
      - 0.15
      - 0.26
      - 0.37
      - 0.52
      - 100.0
      share_bkg_shape: false
  mumu:
    enabled: true
    data:
    - /Users/manzoni/Documents/RDs/rds_momcalib/ntuples_26oct2026/jpsik/data_calib.root
    mc:
    - /Users/manzoni/Documents/RDs/rds_momcalib/ntuples_26oct2026/jpsik/mc_jpsik_calib.root
    tree: tree
    max_data: null
    max_mc: null
    selection: (rf_mass > 5.20) & (rf_mass < 5.36)
    mass_range:
    - 2.96
    - 3.24
    bin_width: 0.002
    background: expo
    bkg_share: channel
    categories:
      eta_edges: null
      dpt_edges:
      - -1000.0
      - -4.0
      - -1.0
      - 1.0
      - 4.0
      - 1000.0
  jpsik:
    enabled: true
    data:
    - /Users/manzoni/Documents/RDs/rds_momcalib/ntuples_26oct2026/jpsik/data_calib.root
    mc:
    - /Users/manzoni/Documents/RDs/rds_momcalib/ntuples_26oct2026/jpsik/mc_jpsik_calib.root
    mc_jpsipi:
    - /Users/manzoni/Documents/RDs/rds_momcalib/ntuples_26oct2026/jpsik/mc_jpsipi_calib.root
    tree: tree
    max_data: null
    max_mc: null
    selection: (abs(jpsi_mass - 3.0969) < 0.15)
    mass_range:
    - 5.05
    - 6.0
    bin_width: 0.002
    background: expo2
    bkg_share: category
    refit_power: 1.0
    argus: true
    categories:
      eta_edges: null
      pt_edges:
      - 2.0
      - 4.0
      - 7.0
      - 1000.0
      split_charge: true
toys:
  data_frac: 0.3
  bkg_frac: 0.1
  bkg_slope: -2.0
  jpsipi_frac: 0.03
  inject:
    A: 0.001
    e: -0.0003
    M_0: -2.0e-05
    M_1: -5.0e-05
    M_2: 0.00012
    a2_0: 6.0
    a2_1: 12.0
    a2_2: 2.0
    c2: 14.0
correction:
  seed: 20181
  dataset: '2018 BParking: R(Ds) right-sign Ds mu (26 Oct 2026) and B+ -> J/psi K+
    (jpsi_tk ntuples, 08 Oct 2026)'
  mc: Bs -> Ds(*) mu nu signal MC (26 Oct 2026); B+ -> J/psi K+ and B+ -> J/psi pi+
    MC (UL2018, 09 Oct 2026)
  notes:
  - Statistical errors only; no systematic uncertainties yet.
  - Every track (kaons, pions, muons) gets the same correction, chosen by its own
    |eta|.
output:
  dir: results/RDs_2018BParking_trkcalib_v4b_base_laptop
  cache: true
  plots: true
